# 1
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: game-2048-lb
  namespace: game-2048
spec:
  scheme: internet-facing
  loadBalancerName: game2048-gateway-api
  loadBalancerSubnetsSelector:
    Name:
      - public-us-east-1a
      - public-us-east-1b
      - public-us-east-1c
---
# 2
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: my-alb-gateway
  namespace: game-2048
spec:
  gatewayClassName: aws-alb-gateway-class
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: game-2048-lb
      group: gateway.k8s.aws
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: game-2048-route
  namespace: game-2048
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-alb-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: service-2048
          port: 80
